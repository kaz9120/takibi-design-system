<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空のモデル</title>
<!--
  空の本気モデル（試作）。太陽の高度という 1 つの値から、空の色、見える星、天の川を計算して描く。
  夜明け、日暮れ、星空は、同じモデルの別の時刻。

  物理から計算している所:
  - 空の色: Rayleigh 散乱、Mie 散乱、オゾンの吸収を、視線に沿って積分する。太陽が地平線の下にあるときは、
    地球の影に入った空気を光らせない。多重散乱は Hillaire (2020) の近似で足す。
    計算は RGB の 3 色ではなく、380〜730 nm を 12 等分した波長で行い、CIE 1931 の等色関数で XYZ にしてから
    sRGB に直す。RGB の 3 色だけで計算すると、オゾンが緑を強く吸うので、薄明の空が青ではなく紫になる
    （「波長の数」を 3 にすると確かめられる）。
      Rayleigh 散乱 1.24062e-6 × λ^-4 /m（λ は µm）、高さの尺度 8 km
      Mie 散乱 3.996e-3 /km、Mie 消散 4.44e-3 /km（波長によらない）、高さの尺度 1.2 km、位相関数 Cornette–Shanks g = 0.8
      オゾン 全量 300 DU、高度 25 km を頂点に上下 15 km で 0 になる三角形の分布。吸収断面積は 233 K の実測の表
      太陽のスペクトル ASTM G-173 の大気圏外の値
      地球の半径 6360 km、大気の上端 6460 km、地面の反射率 0.3
    出典: S. Hillaire, "A Scalable and Production Ready Sky and Atmosphere Rendering Technique", EGSR 2020
          https://github.com/sebh/UnrealEngineSkyAtmosphere （SkyAtmosphereCommon.cpp、RenderSkyRayMarching.hlsl）
          E. Bruneton, https://github.com/ebruneton/precomputed_atmospheric_scattering
          （demo.cc の太陽のスペクトルとオゾンの表、constants.h の等色関数と XYZ→sRGB の行列、透過率の表の座標）
          この 2 つの著作権表示とライセンスの全文は、同じフォルダの THIRD-PARTY-NOTICES.md にある
  - 太陽の位置: Astronomical Almanac の近似式（https://en.wikipedia.org/wiki/Position_of_the_Sun）
  - 恒星時: GMST = 18.697375 + 24.065709824279 × D 時（https://aa.usno.navy.mil/faq/GAST）
  - 星: HYG Database v4.4（David Nash、CC BY-SA 4.0）の 6.5 等より明るい 8920 個（stars.js。出典と改変の内容はファイルの先頭）。赤経・赤緯を、観測地と日時から方位と高度に直す。
    明るさは等級から決める。太陽を −26.74 等として、太陽の照度に対する比 10^(−0.4 (m + 26.74)) を使う。
    明るい星は、頂点の明るさが画面の白の 3 倍を超えないように、光の量を保ったまま広げる（最大で標準偏差 3.5 画素）。
    空の明るさと同じ単位なので、薄明の空に星が埋もれて見えなくなる順番は、計算の結果として出る。
  - 星の色: B−V から温度へ（Ballesteros 2012: T = 4600 (1/(0.92 BV + 1.7) + 1/(0.92 BV + 0.62))、
    https://en.wikipedia.org/wiki/Color_index）。その温度の黒体放射のスペクトルを、空と同じ等色関数で sRGB にする。
  - 大気による星の減光: 空と同じ式で作った 610、550、465 nm の透過率の表を、星の高度で引く。低い星ほど暗く、青が先に減って赤くなる。
  - 限界等級の表示: 天頂の空の明るさ（等級/平方秒角）から Crumey (2014) の式で求める
    （https://en.wikipedia.org/wiki/Limiting_magnitude、観察者の係数 F = 2）。

  近似や、手で決めた所:
  - 天の川: 6.5 等までの星では帯にならない。銀河の円盤を「星の密度が指数関数で減る円盤 + 中心のふくらみ + 薄い塵の層」
    として、太陽の位置から各方向へ視線に沿って積分し、銀河座標の 1024×512 の表に焼いた。
    円盤の尺度（長さ 2.6 kpc、厚さ 0.3 kpc、太陽から中心まで 8.2 kpc）は Bland-Hawthorn & Gerhard (2016) の値を
    記憶で使っていて、原文との照合はできていない。塵の減光は太陽の近くで平均 1.8 等/kpc
    （https://en.wikipedia.org/wiki/Extinction_(astronomy)）。塵の雲のむら（乱数の雑音）、星の密度のむら、ふくらみの大きさ、
    全体の明るさ（銀経 20〜50°、銀緯 ±5° の中央値を 21.0 等/平方秒角に合わせた）は手で決めた。
  - 夜の空の下限: 22 等/平方秒角（https://en.wikipedia.org/wiki/Limiting_magnitude にある最も暗い空の値）の
    大気光を、高度 90 km の薄い層として足した。色は手で決めた。
  - またたき: 強さは 大気の厚さ^1.5 に比例させた（小さい口径では分散が sec^3 z に比例する、という Young 1967 /
    Dravins ほか 1997 の結果を記憶で使っていて、原文との照合はできていない）。天頂での強さと、時間の変化
    （2〜18 Hz の 4 つの波の和）は手で決めた。
  - 露出: 天頂と、高度 20° の 4 方位の空の明るさを 1 画素ずつ計算して読み、その対数の平均の 0.235 乗に比例する
    明るさで表示する。0.235 という指数は手で決めた（人の目の順応をまねるため）。
  - 暗い所での色の見え方: 0.001 cd/m^2 より暗い画素を青みがかった無彩色にし、0.3 cd/m^2 までの間で色を戻す。明るさを感じる細胞の応答は
    V = Y (1.33 (1 + (Y + Z) / X) − 1.68) で近似した（Jensen ほか 2001 "A Physically-Based Night Sky Model" などで
    使われている式を記憶で使っていて、原文との照合はできていない）。色みと、切り替わる明るさの範囲は手で決めた。
  - 多重散乱は等方散乱を仮定した近似なので、太陽が −6° より低い薄明では実際より暗く出る見込み。
  - 大気の屈折（地平線で約 0.57°）、月、惑星、黄道光、歳差（J2000 から約 0.37°）は入れていない。
  - 地平線の山と木立は、乱数で作った輪郭。
-->
<style>
  :root {
    --bg: #0a0907;
    --panel: rgb(19 17 14 / 0.82);
    --line: #3a342b;
    --fg: #ebe5d8;
    --fg-muted: #a8a094;
    --accent: #f47d3a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #0a0907; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 12px; top: 12px; right: 12px; pointer-events: none; display: flex; flex-wrap: wrap; gap: 4px 16px;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgb(0 0 0 / 0.8); }
  #hud b { font-weight: 600; }

  #panel { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 760px; margin: 0 auto; background: var(--panel);

  #panel .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }

<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="err"></div>
<div id="panel">
  <div class="row">
    <label for="sun">太陽の高度</label>
    <input id="sun" type="range" min="-30" max="30" step="0.1" value="-8">
    <span id="sunLabel"></span>
    <select id="branch" aria-label="朝か夕方か">
      <option value="evening">夕方</option>
      <option value="morning">朝</option>
    </select>
    <button id="auto" type="button" aria-pressed="false">時刻を進める</button>
  </div>
  <details>
    <summary>細かい設定</summary>
    <div class="row">
      <label>日付 <input id="date" type="date" value="2026-11-19"></label>
      <label>露出の補正 <input id="ev" type="range" min="-3" max="3" step="0.1" value="0"><span id="evLabel">0 EV</span></label>
      <label>またたき <input id="twinkle" type="range" min="0" max="0.4" step="0.01" value="0.12"></label>
    </div>
    <div class="row">
      <label>空の解像度
        <select id="scale"><option value="1">1 倍</option><option value="0.5" selected>1/2</option><option value="0.25">1/4</option></select>
      </label>
      <label>積分の回数
        <select id="steps"><option>12</option><option>24</option><option selected>32</option><option>48</option></select>
      </label>
      <label>波長の数
        <select id="bands"><option>3</option><option>6</option><option selected>12</option></select>
      </label>
      <label><input id="ms" type="checkbox" checked> 多重散乱</label>
      <label><input id="ozone" type="checkbox" checked> オゾン</label>
      <label><input id="mw" type="checkbox" checked> 天の川</label>
      <label><input id="land" type="checkbox" checked> 山と木立</label>
      <label><input id="night" type="checkbox" checked> 暗い所での色の見え方</label>
    </div>
    <div class="row" style="color: var(--fg-muted)">画面を横に引くと見る方位が変わり、縦に引くと見上げる角度が変わる。</div>
  </details>
</div>
<script src="stars.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- 観測地と日時
const SITE = { name: "北緯 36.0°、東経 138.5°、標高 1200 m", lat: 36.0, lon: 138.5, heightKm: 1.2 };
const RAD = Math.PI / 180;
const params = new URLSearchParams(location.search);

/** ユリウス日（UT）。date は Date */
const julian = (date) => date.getTime() / 86400000 + 2440587.5;

/** 太陽の赤経と赤緯（ラジアン）。Astronomical Almanac の近似式で、誤差は約 0.01° */
function sunEquatorial(jd) {
  const n = jd - 2451545.0;
  const L = (280.460 + 0.9856474 * n) * RAD;
  const g = (357.528 + 0.9856003 * n) * RAD;
  const lambda = L + (1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
  const eps = (23.439 - 0.0000004 * n) * RAD;
  return { ra: Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)), dec: Math.asin(Math.sin(eps) * Math.sin(lambda)) };
}

/** 地方恒星時（ラジアン） */
function localSidereal(jd, lonDeg) {
  const gmstHours = 18.697375 + 24.065709824279 * (jd - 2451545.0);
  return ((((gmstHours * 15 + lonDeg) % 360) + 360) % 360) * RAD;
}

/** 赤道座標のベクトルを、東・北・上のベクトルへ直す行列（行優先の 9 個） */
function eqToHorizontal(lst, latDeg) {
  const sL = Math.sin(lst), cL = Math.cos(lst), sP = Math.sin(latDeg * RAD), cP = Math.cos(latDeg * RAD);
  return [-sL, cL, 0, -sP * cL, -sP * sL, cP, cP * cL, cP * sL, sP];
}
const mulMV = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
const transpose = (m) => [m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]];
const mulMM = (a, b) => { const o = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o.push(a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c]); return o; };
// 赤道座標（J2000）から銀河座標へ。Hipparcos カタログの定義の行列
const EQ_TO_GAL = [-0.0548755604, -0.8734370902, -0.4838350155, 0.4941094279, -0.4448296300, 0.7469822445, -0.8676661490, -0.1980763734, 0.4559837762];

function sunHorizontal(jd) {
  const s = sunEquatorial(jd);
  const v = [Math.cos(s.dec) * Math.cos(s.ra), Math.cos(s.dec) * Math.sin(s.ra), Math.sin(s.dec)];
  const h = mulMV(eqToHorizontal(localSidereal(jd, SITE.lon), SITE.lat), v);
  return { vec: h, alt: Math.asin(h[2]) / RAD, az: ((Math.atan2(h[0], h[1]) / RAD) + 360) % 360 };
}

/** その日のうちで、太陽の高度が target（度）になる時刻を探す。夕方は南中のあと、朝は南中の前 */
function solveTime(dateStr, target, branch) {
  // 日本標準時の 0 時から 1 分ごとに 36 時間ぶん調べる
  const start = julian(new Date(`${dateStr}T00:00:00+09:00`));
  const alts = [];
  for (let i = 0; i <= 36 * 60; i++) alts.push(sunHorizontal(start + i / 1440).alt);
  let noon = 0;
  for (let i = 0; i < 24 * 60; i++) if (alts[i] > alts[noon]) noon = i;
  const dir = branch === "evening" ? 1 : -1;
  const limit = branch === "evening" ? Math.min(alts.length - 1, noon + 12 * 60) : Math.max(1, noon - 12 * 60);
  for (let i = noon; i !== limit; i += dir) {
    const a = alts[i], b = alts[i + dir];
    if ((a - target) * (b - target) <= 0 && a !== b) return start + (i + dir * (a - target) / (a - b)) / 1440;
  }
  return start + (target > alts[noon] ? noon : limit) / 1440;
}

// ---------------------------------------------------------------- WebGL
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
const fail = (msg) => { const e = document.getElementById("err"); e.style.display = "flex"; e.textContent = msg; throw new Error(msg); };
if (!gl) fail("このブラウザは WebGL2 に対応していないので、空を描けない。");
if (!gl.getExtension("EXT_color_buffer_float")) fail("このブラウザは浮動小数のテクスチャに描けないので、空を描けない。");
const timerExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");

const VS_QUAD = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const ATMOSPHERE = `
const float PI = 3.14159265358979;
const float Rg = 6360.0;   // 地球の半径 km
const float Rt = 6460.0;   // 大気の上端 km
uniform vec3 bR;             // Rayleigh 散乱 1/km。1 回の計算で 3 つの波長を扱う
uniform vec3 bO;             // オゾンの吸収 1/km
const float bMs = 3.996e-3;  // Mie 散乱 1/km（波長によらない）
const float bMe = 4.44e-3;   // Mie 消散 1/km
uniform float uOzone;
uniform float uMs;
uniform sampler2D uTrans;
uniform sampler2D uMulti;

void medium(float h, out vec3 scatR, out float scatM, out vec3 ext) {
  float dR = exp(-h / 8.0);
  float dM = exp(-h / 1.2);
  float dO = max(0.0, h < 25.0 ? h / 15.0 - 2.0 / 3.0 : -h / 15.0 + 8.0 / 3.0) * uOzone;
  scatR = bR * dR;
  scatM = bMs * dM;
  ext = scatR + vec3(bMe * dM) + bO * dO;
}
// 原点が中心の球と、点 o から向き d の半直線が交わる距離。x は手前、y は奥。交わらなければ負
vec2 raySphere(vec3 o, vec3 d, float R) {
  float b = dot(o, d);
  float c = dot(o, o) - R * R;
  float disc = b * b - c;
  if (disc < 0.0) return vec2(-1.0);
  float s = sqrt(disc);
  return vec2(-b - s, -b + s);
}
vec2 transUv(float r, float mu) {
  float H = sqrt(Rt * Rt - Rg * Rg);
  float rho = sqrt(max(0.0, r * r - Rg * Rg));
  float d = max(0.0, -r * mu + sqrt(max(0.0, r * r * (mu * mu - 1.0) + Rt * Rt)));
  float dmin = Rt - r, dmax = rho + H;
  vec2 uv = vec2((d - dmin) / (dmax - dmin), rho / H);
  return uv * vec2(255.0 / 256.0, 63.0 / 64.0) + vec2(0.5 / 256.0, 0.5 / 64.0);
}
vec3 transmittance(float r, float mu) { return texture(uTrans, transUv(r, mu)).rgb; }
// 点 p から太陽までの透過率。地球の影に入っていれば 0
vec3 sunLight(vec3 p, vec3 sun) {
  float r = length(p);
  vec2 g = raySphere(p, sun, Rg);
  if (g.x > 0.0) return vec3(0.0);
  return transmittance(r, dot(p, sun) / r);
}
vec3 multiScatter(float h, float muS) {
  vec2 uv = vec2(muS * 0.5 + 0.5, clamp(h / (Rt - Rg), 0.0, 1.0));
  return texture(uMulti, uv * (31.0 / 32.0) + 0.5 / 32.0).rgb * uMs;
}
`;

// 透過率の表: 高さ r の点から、天頂との角の余弦 mu の向きに、大気の上端まで積分した透過率
const FS_TRANS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${ATMOSPHERE}
void main() {
  vec2 uv = (vUv - vec2(0.5 / 256.0, 0.5 / 64.0)) / vec2(255.0 / 256.0, 63.0 / 64.0);
  float H = sqrt(Rt * Rt - Rg * Rg);
  float rho = H * clamp(uv.y, 0.0, 1.0);
  float r = sqrt(rho * rho + Rg * Rg);
  float dmin = Rt - r, dmax = rho + H;
  float d = dmin + clamp(uv.x, 0.0, 1.0) * (dmax - dmin);
  float mu = d == 0.0 ? 1.0 : clamp((H * H - rho * rho - d * d) / (2.0 * r * d), -1.0, 1.0);
  vec3 p = vec3(0.0, 0.0, r);
  vec3 dir = vec3(sqrt(max(0.0, 1.0 - mu * mu)), 0.0, mu);
  vec3 tau = vec3(0.0);
  const int N = 40;
  float dt = d / float(N);
  for (int i = 0; i < N; i++) {
    vec3 q = p + dir * (float(i) + 0.5) * dt;
    vec3 sR, e; float sM;
    medium(length(q) - Rg, sR, sM, e);
    tau += e * dt;
  }
  o = vec4(exp(-tau), 1.0);
}`;

// 多重散乱の表（Hillaire 2020 の式 5〜10）。横は太陽の天頂角の余弦、縦は高さ
const FS_MULTI = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
${ATMOSPHERE}
void main() {
  vec2 uv = clamp((vUv - 0.5 / 32.0) / (31.0 / 32.0), 0.0, 1.0);
  float muS = uv.x * 2.0 - 1.0;
  float h = max(0.01, uv.y * (Rt - Rg));
  vec3 p = vec3(0.0, 0.0, Rg + h);
  vec3 sun = vec3(sqrt(max(0.0, 1.0 - muS * muS)), 0.0, muS);
  vec3 Lsum = vec3(0.0), Fsum = vec3(0.0);
  for (int i = 0; i < 8; i++) for (int j = 0; j < 8; j++) {
    float phi = 2.0 * PI * (float(i) + 0.5) / 8.0;
    float ct = 1.0 - 2.0 * (float(j) + 0.5) / 8.0;
    float st = sqrt(max(0.0, 1.0 - ct * ct));
    vec3 dir = vec3(st * cos(phi), st * sin(phi), ct);
    vec2 g = raySphere(p, dir, Rg);
    bool hit = g.x > 0.0;
    float tmax = hit ? g.x : raySphere(p, dir, Rt).y;
    vec3 L = vec3(0.0), F = vec3(0.0), thr = vec3(1.0);
    const int N = 20;
    float dt = tmax / float(N);
    for (int k = 0; k < N; k++) {
      vec3 q = p + dir * (float(k) + 0.3) * dt;
      vec3 sR, e; float sM;
      medium(length(q) - Rg, sR, sM, e);
      vec3 scat = sR + vec3(sM);
      vec3 T = exp(-e * dt);
      vec3 S = scat * sunLight(q, sun) / (4.0 * PI);

precision highp float;
in vec2 vUv; out vec4 o;

uniform vec3 uFwd, uRight, uUp;
uniform vec2 uTan;

uniform float uCamR;
uniform float uExposure;
uniform int uSteps;
uniform int uProbe;

  gl.uniform1f(prog.u.uOzone, ui.ozone.checked ? 1 : 0);
  gl.uniform1f(prog.u.uMs, ui.ms.checked ? 1 : 0);
  bindTex(0, lutTrans[k].tex); gl.uniform1i(prog.u.uTrans, 0);
  bindTex(1, k < 4 ? lutMulti[k].tex : null); gl.uniform1i(prog.u.uMulti, 1);
}
function buildLuts() {
  bands = makeBands(Number(ui.bands.value));
  gl.disable(gl.BLEND);
  [...bands, STAR_BAND].forEach((band, i) => {
    const k = band === STAR_BAND ? 4 : i;
    gl.useProgram(progTrans.p); atmosphereUniforms(progTrans, band, k); bindTex(0, null); bindTex(1, null); drawQuad(lutTrans[k]);
    if (k === 4) return;
    gl.useProgram(progMulti.p); atmosphereUniforms(progMulti, band, k); bindTex(1, null); drawQuad(lutMulti[k]);
  });
}

// ---------------------------------------------------------------- 星
const STARS = window.TAKIBI_STARS || [];
const starCount = STARS.length / 4;
{
  const data = new Float32Array(starCount * 8);
  for (let i = 0; i < starCount; i++) {
    const ra = STARS[i * 4] * RAD, dec = STARS[i * 4 + 1] * RAD, mag = STARS[i * 4 + 2], bv = STARS[i * 4 + 3];
    const T = 4600 * (1 / (0.92 * bv + 1.7) + 1 / (0.92 * bv + 0.62));
    // 温度 T の黒体放射のスペクトルを sRGB にして、明るさ（Y）を 1 にそろえる
    const rgb = [0, 0, 0]; let y = 0;
    for (let nm = 385; nm <= 725; nm += 10) {
      const e = planck(nm, T) / planck(550, T), c = rgbOf(nm);
      rgb[0] += e * c[0]; rgb[1] += e * c[1]; rgb[2] += e * c[2]; y += e * table(CMF_Y, 380, nm);
    }
    data.set([Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec),
      Math.max(0, rgb[0] / y), Math.max(0, rgb[1] / y), Math.max(0, rgb[2] / y), 10 ** (-0.4 * (mag + 26.74)), (i * 0.61803398875) % 1], i * 8);
  }
  var starVao = gl.createVertexArray();
  gl.bindVertexArray(starVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const loc = (name) => gl.getAttribLocation(progStar.p, name);
  for (const [name, size, offset] of [["aEq", 3, 0], ["aColorFlux", 4, 12], ["aSeed", 1, 28]]) {
    const l = loc(name);
    if (l < 0) continue;
    gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l, size, gl.FLOAT, false, 32, offset);
  }
}

// ---------------------------------------------------------------- 天の川
// 銀河の円盤を、太陽の位置から各方向へ GPU で積分する。単位は kpc。結果は銀河座標（銀経 −180〜180°、銀緯 −90〜90°）の 1024×512 の表
const GAL_W = 1024, GAL_H = 512;
const galaxyTex = gl.createTexture();
let galaxyScale = 0;
const FS_GALAXY = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
const float PI = 3.14159265358979;
float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1, 0, 0)), f.x), mix(h3(i + vec3(0, 1, 0)), h3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(h3(i + vec3(0, 0, 1)), h3(i + vec3(1, 0, 1)), f.x), mix(h3(i + vec3(0, 1, 1)), h3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p = p * 2.03 + vec3(7.1, 3.3, 5.7); a *= 0.5; } return s; }
void main() {
  const float R0 = 8.2, Z0 = 0.02;
  float l = (vUv.x - 0.5) * 2.0 * PI, b = (vUv.y - 0.5) * PI;
  vec3 d = vec3(cos(b) * cos(l), cos(b) * sin(l), sin(b));
  float sum = 0.0, tau = 0.0, s0 = 0.0;
  const int N = 72;
  for (int k = 0; k < N; k++) {
    // 0.02 kpc から 25 kpc まで、等比で刻む
    float s1 = 0.02 * pow(1250.0, float(k + 1) / float(N));
    float s = 0.5 * (s0 + s1), ds = s1 - s0;
    s0 = s1;
    vec3 q = vec3(-R0, 0.0, Z0) + s * d;
    float R = length(q.xy), az = abs(q.z);
    if (R > 16.0) continue;
    // 星: 薄い円盤（長さ 2.6、厚さ 0.3）+ 厚い円盤（長さ 2.0、厚さ 0.9、太陽の近くで 4%）+ 中心のふくらみ。星の密度に ±50% のむら
    float stars = exp(-(R - R0) / 2.6 - az / 0.3) * (0.45 + 1.1 * fbm(q * vec3(1.6, 1.6, 5.0) + 31.0))
      + 0.04 * exp(-(R - R0) / 2.0 - az / 0.9)
      + 60.0 * exp(-length(vec3(q.xy, q.z / 0.5)) / 0.45);
    // 塵: 厚さ 0.1 の薄い層。太陽の近くで平均 1.8 等/kpc（1.66/kpc）。雲のかたまりとして強いむらを付ける
    float clump = fbm(q * vec3(2.6, 2.6, 9.0));
    float dust = 1.66 * exp(-(R - R0) / 4.0 - az / 0.1) * 0.8 * exp(15.0 * (clump - 0.55));
    float dTau = dust * ds;
    sum += stars * exp(-tau - 0.5 * dTau) * ds;
    tau += dTau;
  }
  o = vec4(sum, 0.0, 0.0, 1.0);
}`;
function buildGalaxy() {
  const prog = program(VS_QUAD, FS_GALAXY);
  const t = target(GAL_W, GAL_H, gl.RGBA32F, gl.NEAREST);
  gl.disable(gl.BLEND);
  gl.useProgram(prog.p);
  drawQuad(t);
  const px = new Float32Array(GAL_W * GAL_H * 4);
  gl.readPixels(0, 0, GAL_W, GAL_H, gl.RGBA, gl.FLOAT, px);
  dispose(t);
  const out = new Float32Array(GAL_W * GAL_H);
  for (let i = 0; i < out.length; i++) out[i] = px[i * 4];
  // 銀経 20〜50°、銀緯 ±5° の中央値を、21.0 等/平方秒角（輝度 3.42e-9）に合わせる
  const band = [];
  for (let j = 0; j < GAL_H; j++) for (let i = 0; i < GAL_W; i++) {
    const b = ((j + 0.5) / GAL_H - 0.5) * 180, l = ((i + 0.5) / GAL_W - 0.5) * 360;
    if (Math.abs(b) < 5 && l > 20 && l < 50) band.push(out[j * GAL_W + i]);
  }
  band.sort((a, b) => a - b);
  const median = band[band.length >> 1];
  for (let i = 0; i < out.length; i++) out[i] /= median;
  galaxyScale = 10 ** (-0.4 * (21.0 + 26.74)) / 2.3504e-11;
  gl.bindTexture(gl.TEXTURE_2D, galaxyTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, GAL_W, GAL_H, 0, gl.RED, gl.FLOAT, out);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  dirty = true;
}
gl.bindTexture(gl.TEXTURE_2D, galaxyTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, 1, 1, 0, gl.RED, gl.FLOAT, new Float32Array([0]));

// ---------------------------------------------------------------- 状態と操作
const $ = (id) => document.getElementById(id);
const ui = { sun: $("sun"), sunLabel: $("sunLabel"), branch: $("branch"), auto: $("auto"), date: $("date"), ev: $("ev"), evLabel: $("evLabel"),
  twinkle: $("twinkle"), scale: $("scale"), steps: $("steps"), bands: $("bands"), ms: $("ms"), ozone: $("ozone"), mw: $("mw"), land: $("land"), night: $("night") };
if (params.has("date")) ui.date.value = params.get("date");
if (params.has("branch")) ui.branch.value = params.get("branch");
if (params.has("alt")) ui.sun.value = params.get("alt");
if (params.has("ev")) ui.ev.value = params.get("ev");
if (params.has("scale")) ui.scale.value = params.get("scale");
if (params.has("bands")) ui.bands.value = params.get("bands");
if (params.has("ozone")) ui.ozone.checked = params.get("ozone") !== "0";
if (params.has("ms")) ui.ms.checked = params.get("ms") !== "0";
if (params.has("land")) ui.land.checked = params.get("land") !== "0";
if (params.has("night")) ui.night.checked = params.get("night") !== "0";

let jd = solveTime(ui.date.value, Number(ui.sun.value), ui.branch.value);
if (params.has("time")) jd = julian(new Date(`${ui.date.value}T${params.get("time")}:00+09:00`));
// 見る向き。方位は北から東回りの度。初めは、その日の日の入りの方位
let viewAz = params.has("az") ? Number(params.get("az")) : sunHorizontal(solveTime(ui.date.value, 0, ui.branch.value)).az;
let viewPitch = params.has("pitch") ? Number(params.get("pitch")) : 31;
const FOV_Y = 80;
let dirty = true, auto = params.get("auto") === "1", exposure = 1, zenith = 0, dayLevel = 0;

function setFromSlider() { jd = solveTime(ui.date.value, Number(ui.sun.value), ui.branch.value); dirty = true; }
ui.sun.addEventListener("input", () => { auto = false; ui.auto.setAttribute("aria-pressed", "false"); setFromSlider(); });
ui.branch.addEventListener("change", () => { viewAz = sunHorizontal(solveTime(ui.date.value, 0, ui.branch.value)).az; setFromSlider(); });
ui.date.addEventListener("change", setFromSlider);
ui.auto.addEventListener("click", () => { auto = !auto; ui.auto.setAttribute("aria-pressed", String(auto)); });
for (const id of ["ev", "twinkle", "steps", "mw", "land", "ms", "night"]) ui[id].addEventListener("input", () => { dirty = true; });
ui.scale.addEventListener("change", () => { resize(true); });
for (const id of ["ozone", "bands"]) ui[id].addEventListener("change", () => { buildLuts(); dayLevel = 0; dirty = true; });
ui.ms.addEventListener("change", () => { dayLevel = 0; dirty = true; });

let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, az: viewAz, pitch: viewPitch }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const degPerPx = FOV_Y / canvas.clientHeight;
  viewAz = (drag.az - (e.clientX - drag.x) * degPerPx + 360) % 360;
  viewPitch = Math.min(70, Math.max(10, drag.pitch + (e.clientY - drag.y) * degPerPx));
  dirty = true;
});
canvas.addEventListener("pointerup", () => { drag = null; });
canvas.addEventListener("pointercancel", () => { drag = null; });

function resize(force) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (!force && canvas.width === w && canvas.height === h && skyTarget) return;
  canvas.width = w; canvas.height = h;
  dispose(skyTarget); dispose(starTarget);
  const s = Number(ui.scale.value);
  skyTarget = target(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)), gl.RGBA16F, gl.LINEAR);
  starTarget = target(w, h, gl.RGBA16F, gl.NEAREST);
  dirty = true;
}
new ResizeObserver(() => resize(false)).observe(canvas);

function camera() {
  const az = viewAz * RAD, p = viewPitch * RAD;
  const tanY = Math.tan(FOV_Y / 2 * RAD);
  return {
    fwd: [Math.sin(az) * Math.cos(p), Math.cos(az) * Math.cos(p), Math.sin(p)],
    right: [Math.cos(az), -Math.sin(az), 0],
    up: [-Math.sin(az) * Math.sin(p), -Math.cos(az) * Math.sin(p), Math.cos(p)],
    tan: [tanY * canvas.width / canvas.height, tanY],
  };
}
function cameraUniforms(prog, cam) {
  gl.uniform3fv(prog.u.uFwd, cam.fwd); gl.uniform3fv(prog.u.uRight, cam.right); gl.uniform3fv(prog.u.uUp, cam.up);
  gl.uniform2fv(prog.u.uTan, cam.tan);
}
const colMajor = (m) => new Float32Array(transpose(m));

const luminance = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

/**
 * 空を target に描く。波長の組ごとに 1 回ずつ計算して足す。
 * probeDirs（5 つの向き）を渡すと、その向きの 5 画素だけを露出なしで描き、組ごとに onBand を呼ぶ。
 */
function renderSky(t, cam, sunVec, horToGal, probeDirs, onBand) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  // 32 ビットの浮動小数には足し込めない環境があるので、計測のときは組ごとに読んで CPU で足す
  if (probeDirs) gl.disable(gl.BLEND); else { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); }
  gl.useProgram(progSky.p);
  cameraUniforms(progSky, cam);
  gl.uniform3fv(progSky.u.uSun, sunVec);
  gl.uniform1f(progSky.u.uCamR, 6360 + SITE.heightKm);
  gl.uniform1f(progSky.u.uExposure, exposure);
  gl.uniform1i(progSky.u.uSteps, probeDirs ? 48 : Number(ui.steps.value));
  gl.uniform1i(progSky.u.uProbe, probeDirs ? 1 : 0);
  if (probeDirs) gl.uniform3fv(progSky.u["uProbeDirs[0]"], probeDirs.flat());
  gl.uniformMatrix3fv(progSky.u.uHorToGal, false, colMajor(horToGal));
  gl.uniform1f(progSky.u.uGalaxyOn, ui.mw.checked && !probeDirs ? 1 : 0);
  gl.uniform1f(progSky.u.uGalaxyScale, galaxyScale);
  bands.forEach((band, k) => {
    atmosphereUniforms(progSky, band, k);
    bindTex(2, galaxyTex); gl.uniform1i(progSky.u.uGalaxy, 2);
    gl.uniformMatrix3fv(progSky.u.uWeight, false, band.weight);
    gl.uniform3fv(progSky.u.uAir, band.air);
    gl.uniform3fv(progSky.u.uGal, band.gal);
    drawQuad(t);
    if (onBand) onBand();
  });
  gl.disable(gl.BLEND);
}
/**
 * 露出を決めるための明るさ（太陽の光そのものを 1 とした輝度）。
 * 天頂と、高度 20° の 4 方位（太陽の方位から 90° ごと）を 1 画素ずつ計算して読み、対数の平均を取る。
 */
function meter(sunVec, horToGal) {
  const az = Math.atan2(sunVec[0], sunVec[1]), c = Math.cos(20 * RAD), sn = Math.sin(20 * RAD);
  const dirs = [[0, 0, 1], ...[0, 1, 2, 3].map((i) => [Math.sin(az + i * Math.PI / 2) * c, Math.cos(az + i * Math.PI / 2) * c, sn])];
  const sum = new Float32Array(20), px = new Float32Array(20);
  renderSky(probe, camera(), sunVec, horToGal, dirs, () => {
    gl.readPixels(0, 0, 5, 1, gl.RGBA, gl.FLOAT, px);
    for (let i = 0; i < 20; i++) sum[i] += px[i];
  });
  const values = dirs.map((_, i) => Math.max(1e-12, luminance(sum.subarray(i * 4, i * 4 + 3))));
  return { level: Math.exp(values.reduce((a, v) => a + Math.log(v), 0) / values.length), zenith: values[0] };
}

const KEY = Number(params.get("key") || 0.3), ADAPT = Number(params.get("adapt") || 0.235);
let query = null, gpuMs = null, frameMs = 16.7, lastFrame = 0, startTime = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (!skyTarget) return;
  const dt = lastFrame ? now - lastFrame : 16.7;
  lastFrame = now;
  frameMs += (dt - frameMs) * 0.05;
  if (auto) {
    // 1 秒で 4 分進める。夕方は時刻を進め、朝も同じ向きに進める
    jd += (dt / 1000) * 240 / 86400;
    dirty = true;
  }
  const sun = sunHorizontal(jd);
  const eqToHor = eqToHorizontal(localSidereal(jd, SITE.lon), SITE.lat);
  const horToGal = mulMM(EQ_TO_GAL, transpose(eqToHor));
  const cam = camera();
  gl.disable(gl.BLEND);

  if (timerExt && query === null && dirty) { query = gl.createQuery(); gl.beginQuery(timerExt.TIME_ELAPSED_EXT, query); var timing = true; }

  if (dirty) {
    if (!dayLevel) {
      // 基準にする昼の明るさ。太陽の高度 30° のとき
      const a = 30 * RAD;
      dayLevel = meter([0, Math.cos(a), Math.sin(a)], horToGal).level;
    }
    const m = meter(sun.vec, horToGal);
    zenith = m.zenith;
    // 露出。空の明るさが、昼の明るさとの比の 0.235 乗に比例して表示されるようにする
    exposure = KEY * (m.level / dayLevel) ** ADAPT / m.level * 2 ** Number(ui.ev.value);
    renderSky(skyTarget, cam, sun.vec, horToGal, null, null);
    updateHud(sun);
    dirty = false;
  }

  // 星は毎コマ描く（またたきがあるので）
  gl.bindFramebuffer(gl.FRAMEBUFFER, starTarget.fbo);
  gl.viewport(0, 0, starTarget.w, starTarget.h);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progStar.p);
  atmosphereUniforms(progStar, STAR_BAND, 4);
  cameraUniforms(progStar, cam);
  gl.uniformMatrix3fv(progStar.u.uEqToHor, false, colMajor(eqToHor));
  gl.uniform1f(progStar.u.uCamR, 6360 + SITE.heightKm);
  gl.uniform1f(progStar.u.uExposure, exposure);
  gl.uniform1f(progStar.u.uPixelSr, (2 * cam.tan[1] / canvas.height) ** 2);
  gl.uniform1f(progStar.u.uDpr, canvas.height / canvas.clientHeight);
  gl.uniform1f(progStar.u.uTime, params.has("still") ? 0 : ((now - startTime) / 1000) % 600);
  gl.uniform1f(progStar.u.uTwinkle, params.has("still") ? 0 : Number(ui.twinkle.value));
  gl.bindVertexArray(starVao);
  gl.drawArrays(gl.POINTS, 0, starCount);
  gl.disable(gl.BLEND);

  gl.useProgram(progFinal.p);
  cameraUniforms(progFinal, cam);
  bindTex(0, skyTarget.tex); gl.uniform1i(progFinal.u.uSky, 0);
  bindTex(1, starTarget.tex); gl.uniform1i(progFinal.u.uStars, 1);
  gl.uniform1f(progFinal.u.uLand, ui.land.checked ? 1 : 0);
  gl.uniform1f(progFinal.u.uPitch, viewPitch);
  gl.uniform1f(progFinal.u.uNight, ui.night.checked ? 1 : 0);
  // 太陽の光そのものの照度を 128000 lx として、画面の値（輝度 × 露出）を cd/m^2 に直す
  gl.uniform1f(progFinal.u.uToCd, 128000 / exposure);
  drawQuad(null);

  if (timing) { gl.endQuery(timerExt.TIME_ELAPSED_EXT); const q = query; const poll = () => {
    if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) { setTimeout(poll, 30); return; }
    if (!gl.getParameter(timerExt.GPU_DISJOINT_EXT)) gpuMs = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6;
    gl.deleteQuery(q); query = null; }; setTimeout(poll, 30); }
}

function updateHud(sun) {
  if (!auto || Math.abs(sun.alt) <= 30) ui.sun.value = String(Math.max(-30, Math.min(30, sun.alt)));
  ui.sunLabel.textContent = `${sun.alt >= 0 ? "+" : "−"}${Math.abs(sun.alt).toFixed(1)}°`;
  ui.evLabel.textContent = `${Number(ui.ev.value) >= 0 ? "+" : ""}${Number(ui.ev.value).toFixed(1)} EV`;
  const jst = new Date((jd - 2440587.5) * 86400000 + 9 * 3600000);
  const pad = (n) => String(n).padStart(2, "0");
  const when = `${jst.getUTCFullYear()}-${pad(jst.getUTCMonth() + 1)}-${pad(jst.getUTCDate())} ${pad(jst.getUTCHours())}:${pad(jst.getUTCMinutes())}`;
  // 天頂の明るさを等級/平方秒角に直す。1 平方秒角 = 2.3504e-11 sr、太陽は −26.74 等
  const mu = -2.5 * Math.log10(zenith * 2.3504e-11) - 26.74;
  // 限界等級（Crumey 2014、F = 2）。18 等/平方秒角より明るい空は、18〜20 の式を延ばした値
  const nelm = (mu > 20 ? 0.383 * mu - 1.44 : 0.27 * mu + 0.8) - 2.5 * Math.log10(2);
  const phase = sun.alt > 0 ? "昼" : sun.alt > -6 ? "市民薄明" : sun.alt > -12 ? "航海薄明" : sun.alt > -18 ? "天文薄明" : "夜";
  $("hud").innerHTML =
    `<div><b>${when}</b> <span>日本標準時 ・ ${SITE.name}</span></div>` +
    `<div><span>太陽</span> 高度 ${sun.alt.toFixed(1)}° 方位 ${sun.az.toFixed(0)}° <span>（${phase}）</span></div>` +
    `<div><span>見る方位</span> ${viewAz.toFixed(0)}° <span>見上げる角度</span> ${viewPitch.toFixed(0)}°</div>` +
    `<div><span>天頂の空</span> ${mu.toFixed(1)} 等/平方秒角 <span>見える星</span> ${nelm < -1 ? "なし" : nelm.toFixed(1) + " 等まで"}</div>` +
    `<div><span>1 コマ</span> ${frameMs.toFixed(1)} ms${gpuMs !== null ? `<span>（空の計算を含む GPU の時間 ${gpuMs.toFixed(1)} ms）</span>` : ""}</div>`;
}
setInterval(() => { if (!dirty) updateHud(sunHorizontal(jd)); }, 500);

buildLuts();
resize(true);
requestAnimationFrame(frame);
setTimeout(buildGalaxy, 50);
window.__sky = { get state() { const s = sunHorizontal(jd); return { jd, alt: s.alt, az: s.az, exposure, zenith, frameMs, gpuMs, viewAz }; } };
</script>
</body>
</html>
