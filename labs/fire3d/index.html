<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>焚き火の立体モデル</title>
<style>
:root {
	--bg: #0a0907;
	--panel: rgb(26 24 20 / 0.86);
	--line: #3a342b;
	--fg: #ebe5d8;
	--fg-muted: #a8a094;
	--accent: #f47d3a;
	color-scheme: dark; /* 夜の焚き火を描くので、昼のテーマでも暗いままにする */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
#panel { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); width: min(300px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(8px); }
#panel summary { cursor: pointer; font-weight: 600; }
#panel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 10px; color: var(--fg-muted); font-size: 12px; }
#panel label input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
#panel label output { color: var(--fg); font-variant-numeric: tabular-nums; }
#panel .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#panel button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
#panel button:hover, #panel button[aria-pressed="true"] { border-color: var(--accent); }
#panel .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--fg-muted); font-size: 12px; }
#panel p { margin: 10px 0 0; color: var(--fg-muted); font-size: 12px; }
#stats { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--fg-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: pre-line; }
#error { position: fixed; inset: auto 16px 16px 16px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<details id="panel" open>
	<summary>焚き火の立体モデル</summary>
	<p>ドラッグで回す。ホイールかピンチで寄る。</p>
	<div class="row" id="angles"></div>
	<div class="row"><button id="stoke" type="button">薪をくべる</button><button id="tend" type="button">熾を寄せる</button></div>
	<label>火の強さ（燃料の出る量）<output id="o-intensity"></output><input id="intensity" type="range" min="0" max="2.4" step="0.01" value="0.8"></label>
	<label>時間の速さ（薪の燃え進みだけを早送りする）<output id="o-speed"></output><input id="speed" type="range" min="0" max="60" step="1" value="20"></label>
	<label>風（m/s、薪の向きに沿って）<output id="o-wind"></output><input id="wind" type="range" min="-1.5" max="1.5" step="0.05" value="0"></label>
	<label>露出<output id="o-exposure"></output><input id="exposure" type="range" min="-3" max="3" step="0.1" value="0"></label>
	<label>描く解像度<output id="o-scale"></output><input id="scale" type="range" min="0.4" max="1" step="0.05" value="0.8"></label>
	<label class="check"><input id="sparks" type="checkbox" checked>火の粉</label>
	<label class="check"><input id="white" type="checkbox">白い光で見る（火を消して、木の形を確かめる）</label>
	<div id="stats"></div>
</details>
<div id="error"></div>
<script type="module">
/*
 * 焚き火の立体モデルの作業台。計算と描画は packages/takibi/src/fire/engine.js（<takibi-fire> と同じもの）が行い、
 * このページは、視点を動かす操作、値を変える操作盤、焼き出し（?bake=1）の入口だけを持つ。
 * モデルの中身の説明は engine.js の先頭にある。
 *
 * 開き方: リポジトリの直下で python3 -m http.server 8766 --bind 127.0.0.1 を動かし、
 * http://127.0.0.1:8766/labs/fire3d/index.html を開く（engine.js を読むので、labs の中だけを配信しても動かない）。
 */
import { createFireEngine } from "../../packages/takibi/src/fire/engine.js";

const $ = (id) => document.getElementById(id);
const canvas = $("view");
const manual = new URLSearchParams(location.search).has("bake");
let engine;
try {
	engine = createFireEngine(canvas, { manual, powerPreference: "high-performance", timing: true });
	await engine.ready;
} catch (e) {
	const el = $("error"); el.style.display = "block"; el.textContent = `立体モデルを動かせません: ${e.message}`;
	throw e;
}
const { params, cam, ANGLES, logs, fire, sparks, bake } = engine;
let scale = 0.8, lastMove = 0, frameMs = 16.7, last = 0, frames = 0, slow = 0;
const NX = 96, NY = 96, NZ = 64, CELL = 0.8 / NX;

function resize() {
	const dpr = manual ? 1 : Math.min(window.devicePixelRatio || 1, 1.5) * scale;
	engine.resize(canvas.clientWidth * dpr, canvas.clientHeight * dpr);
}
function frame(t) {
	requestAnimationFrame(frame);
	resize();
	const dt = Math.min(0.05, (t - last) / 1000 || 1 / 60); last = t;
	frameMs += (dt * 1000 - frameMs) * 0.05;
	// 1 コマが 24ms を超える状態が 1 秒続いたら、描く解像度を 1 段下げる（下限 45%）
	slow = frameMs > 24 ? slow + 1 : 0;
	if (slow > 60 && scale > 0.45) { slow = 0; engine.set("scale", Math.max(0.45, scale - 0.1)); }
	engine.moving = pointers.size > 0 || performance.now() - lastMove < 160;
	engine.render(t);
	if (++frames % 20 === 0) $("stats").textContent = `画面 ${canvas.width}×${canvas.height}px\n1 コマの間隔 ${frameMs.toFixed(1)}ms\nGPU の時間の目安（仕事の量を変えてもほとんど動かない） ${engine.stats.gpuMs === null ? "測れない" : `${engine.stats.gpuMs.toFixed(1)}ms`}\n角度: 横 ${cam.az.toFixed(0)}°、見下ろし ${cam.el.toFixed(0)}°、距離 ${cam.dist.toFixed(2)}m\n炎の格子 ${NX}×${NY}×${NZ}（1 マス ${(CELL * 1000).toFixed(1)}mm）\n薪を描き直した回数 ${engine.stats.rebuilt}\n薪 ${logs.filter((l) => l.type !== 0).length} 本、熾の量 ${fire.bed.toFixed(2)}、火の粉 ${sparks.length}${fire.message ? `\n${fire.message}` : ""}`;
}

// ---------- 操作 ----------
function bind(id, key, fmt, after) {
	const el = $(id); const out = $(`o-${id}`);
	const apply = () => { params[key] = el.type === "checkbox" ? el.checked : Number(el.value); if (out) out.textContent = fmt(params[key]); after?.(); };
	el.addEventListener("input", apply); apply();
}
bind("speed", "speed", (v) => (v === 0 ? "止める" : `${v} 倍`));
bind("sparks", "sparks");
$("stoke").addEventListener("click", () => engine.stoke());
$("tend").addEventListener("click", () => engine.tend());
bind("intensity", "intensity", (v) => v.toFixed(2));
bind("wind", "wind", (v) => v.toFixed(2));
bind("exposure", "exposure", (v) => `${v > 0 ? "+" : ""}${v.toFixed(1)} 段`);
{ const el = $("scale"), out = $("o-scale"); const apply = () => { scale = Number(el.value); out.textContent = `${Math.round(scale * 100)}%`; }; el.addEventListener("input", apply); apply(); }
bind("white", "white");
ANGLES.forEach((a, i) => {
	const b = document.createElement("button"); b.type = "button"; b.textContent = a.name; b.setAttribute("aria-pressed", String(i === 0));
	b.addEventListener("click", () => { Object.assign(cam, a); for (const x of $("angles").children) x.setAttribute("aria-pressed", String(x === b)); });
	$("angles").appendChild(b);
});
const pointers = new Map(); let pinch = 0;
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); });
canvas.addEventListener("pointermove", (e) => {
	const prev = pointers.get(e.pointerId); if (!prev) return;
	pointers.set(e.pointerId, [e.clientX, e.clientY]);
	if (pointers.size === 1) {
		lastMove = performance.now(); cam.az -= (e.clientX - prev[0]) * 0.35; cam.el = Math.min(80, Math.max(2, cam.el + (e.clientY - prev[1]) * 0.25));
		for (const x of $("angles").children) x.setAttribute("aria-pressed", "false");
	} else if (pointers.size === 2) {
		const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
		if (pinch) cam.dist = Math.min(3, Math.max(0.5, cam.dist * (pinch / d)));
		pinch = d;
	}
});
const lift = (e) => { pointers.delete(e.pointerId); pinch = 0; };
canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);
canvas.addEventListener("wheel", (e) => { e.preventDefault(); cam.dist = Math.min(3, Math.max(0.5, cam.dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
if (window.matchMedia("(max-width: 640px)").matches) $("panel").open = false;
// 焼き出すときの薪: 火が回って、表面のほとんどが炭になった状態にする（燃え進みは下の段 0.76、上の段 0.66。0.8 で折れる）
if (bake.on) { $("panel").hidden = true; params.speed = 0; params.steps = 64; logs.forEach((l, i) => { l.burn = l.type === 0 ? 0.5 : i < 4 ? 0.76 : 0.66; }); fire.bed = 0.6; engine.uploadLogs(); }
engine.set = (k, v) => { if (k !== "scale") params[k] = v; const el = $(k); if (el) { if (el.type === "checkbox") el.checked = v; else el.value = v; el.dispatchEvent(new Event("input")); } };
window.__lab = engine;
if (manual) { resize(); engine.advance(1); } else requestAnimationFrame(frame);
</script>
</body>
</html>
